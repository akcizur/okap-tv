<!doctype html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid TV Grid</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    :root {
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-bg-hover: rgba(255, 255, 255, 0.13);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.28);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #000;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    video {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000; pointer-events: none;
    }

    /* Jemný vignette overlay – ztmaví okraje pro lepší kontrast UI */
    .Vignette {
      position: fixed; inset: 0; z-index: 9997;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.35) 100%);
      opacity: 0;
      transition: opacity 0.6s var(--ease-soft);
    }
    body:not(.IdleUI) .Vignette { opacity: 1; }

    /* ============================================================
       CENTER OVERLAY
       ============================================================ */
    .CenterPlayOverlay {
      position: fixed; inset: 0; z-index: 9998;
      display: flex; justify-content: center; align-items: center;
      pointer-events: none;
      transition: opacity 0.55s var(--ease-soft), transform 0.55s var(--ease-soft);
    }

    .CenterButtonsRow {
      display: flex;
      align-items: center;
      gap: 24px;
      pointer-events: none;
    }

    .CenterSpacerLeft {
      width: 216px;              /* 56+24+56+24+56 */
      height: 56px;
      visibility: hidden;
      pointer-events: none;
      flex-shrink: 0;
    }

    /* --- Channel Info (bez rámečku, elegantní) --- */
    .ChannelInfo {
      position: absolute;
      top: 50%;
      right: calc(50% + 73px);   /* 47px (půlka PLAY) + 26px mezera */
      transform: translateY(-50%);
      z-index: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      transition: opacity 0.55s var(--ease-soft), transform 0.55s var(--ease-soft);
      pointer-events: none;
      max-width: 400px;
    }

    .ChannelInfo span {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
      order: 1;
      line-height: 1.1;
      text-shadow:
        0 1px 2px rgba(0,0,0,0.6),
        0 4px 16px rgba(0,0,0,0.55);
    }

    .ChannelInfo img {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: contain;
      flex-shrink: 0;
      order: 2;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,0.7));
    }

    /* --- PLAY – hlavní tlačítko --- */
    .CenterPlayBtn {
      position: relative;
      width: 94px; height: 94px; border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.14) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset,
        0 12px 40px rgba(0,0,0,0.55),
        0 0 0 1px rgba(0,0,0,0.15);
      pointer-events: auto;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition:
        transform 0.35s var(--ease-out),
        background 0.3s var(--ease-soft),
        border-color 0.3s var(--ease-soft),
        box-shadow 0.35s var(--ease-soft);
      flex-shrink: 0;
    }
    .CenterPlayBtn:hover {
      transform: scale(1.07);
      background:
        linear-gradient(145deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%);
      border-color: var(--glass-border-hover);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.22) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset,
        0 16px 50px rgba(0,0,0,0.6),
        0 0 30px rgba(255,255,255,0.06);
    }
    .CenterPlayBtn:active { transform: scale(0.98); }

    .CenterPlayBtn svg {
      width: 38px; height: 38px;
      fill: #fff;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
      transition: transform 0.3s var(--ease-out);
    }

    /* --- Menší kruhová tlačítka --- */
    .CenterCircleBtn {
      position: relative;
      width: 56px; height: 56px; border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.025) 100%);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset,
        0 8px 28px rgba(0,0,0,0.5);
      pointer-events: auto;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition:
        transform 0.35s var(--ease-out),
        background 0.3s var(--ease-soft),
        border-color 0.3s var(--ease-soft),
        box-shadow 0.35s var(--ease-soft);
      flex-shrink: 0;
      color: #fff;
    }
    .CenterCircleBtn:hover {
      transform: scale(1.09);
      background:
        linear-gradient(145deg, rgba(255,255,255,0.17) 0%, rgba(255,255,255,0.05) 100%);
      border-color: var(--glass-border-hover);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.20) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset,
        0 12px 36px rgba(0,0,0,0.55);
    }
    .CenterCircleBtn:active { transform: scale(0.96); }

    .CenterCircleBtn svg {
      width: 22px; height: 22px;
      stroke: #fff; stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
      transition: stroke 0.25s var(--ease-soft);
    }

    /* --- Volume --- */
    .VolumeWrapper {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .VolumeSliderPopup {
      position: absolute;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%) scale(0.85) translateY(8px);
      transform-origin: bottom center;
      width: 52px;
      height: 190px;
      background:
        linear-gradient(180deg, rgba(30,30,32,0.94) 0%, rgba(18,18,20,0.94) 100%);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 26px;
      opacity: 0; pointer-events: none;
      transition:
        opacity 0.3s var(--ease-soft),
        transform 0.35s var(--ease-out);
      display: flex; align-items: center; justify-content: center;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.10) inset,
        0 20px 60px rgba(0,0,0,0.7),
        0 0 0 1px rgba(0,0,0,0.25);
    }
    .VolumeWrapper.open .VolumeSliderPopup {
      opacity: 1; pointer-events: auto;
      transform: translateX(-50%) scale(1) translateY(0);
    }

    .VolumeSliderContainer {
      transform: rotate(-90deg);
      display: flex; align-items: center; justify-content: center;
      width: 160px; height: 52px; flex-shrink: 0;
    }

    .VolumeSliderContainer input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 5px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      outline: none; cursor: pointer; margin: 0;
      flex-shrink: 0;
    }
    .VolumeSliderContainer input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px; border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fff 0%, #e8e8e8 100%);
      box-shadow:
        0 0 0 4px rgba(255,255,255,0.08),
        0 4px 14px rgba(0,0,0,0.6),
        0 1px 2px rgba(0,0,0,0.4);
      transition: transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-soft);
      cursor: grab;
    }
    .VolumeSliderContainer input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.15);
      cursor: grabbing;
      box-shadow:
        0 0 0 6px rgba(255,255,255,0.12),
        0 6px 20px rgba(0,0,0,0.7);
    }
    .VolumeSliderContainer input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px; border: none; border-radius: 50%;
      background: #fff;
      box-shadow:
        0 0 0 4px rgba(255,255,255,0.08),
        0 4px 14px rgba(0,0,0,0.6);
      cursor: grab;
    }

    /* --- Grid overlay --- */
    .GridOverlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(6, 6, 8, 0.82);
      backdrop-filter: blur(24px) saturate(1.1);
      -webkit-backdrop-filter: blur(24px) saturate(1.1);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.35s var(--ease-soft), visibility 0.35s var(--ease-soft);
    }
    .GridOverlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

    .GridContainer {
      width: 90%; max-width: 1120px; max-height: 80vh; overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 22px 18px; padding: 24px 12px;
      justify-content: center;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.18) transparent;
    }
    .GridContainer::-webkit-scrollbar { width: 8px; }
    .GridContainer::-webkit-scrollbar-track { background: transparent; }
    .GridContainer::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
    }
    .GridContainer::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.3);
    }

    .GridItem {
      position: relative;
      width: 88px; height: 88px; margin: auto; border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition:
        transform 0.35s var(--ease-out),
        box-shadow 0.35s var(--ease-soft),
        background 0.3s var(--ease-soft),
        border-color 0.3s var(--ease-soft);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .GridItem img {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: contain; pointer-events: none;
      transition: transform 0.35s var(--ease-out);
    }
    .GridItem:hover {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
      border-color: rgba(255,255,255,0.22);
    }
    .GridItem.active {
      border-color: #fff;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.06) 100%);
      box-shadow:
        0 0 0 1px #fff,
        0 0 24px rgba(255,255,255,0.18),
        0 12px 40px rgba(0,0,0,0.5);
      transform: scale(1.05);
    }
    .GridItem.hovered {
      transform: scale(1.14);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.7),
        0 12px 36px rgba(0,0,0,0.5),
        0 0 30px rgba(255,255,255,0.12);
      z-index: 2;
    }
    .GridItem.hovered img { transform: scale(1.05); }

    /* --- Loading / Error / Hint --- */
    .LoadingSpinner {
      position: fixed; top: 32px; left: 50%;
      width: 32px; height: 32px; margin-left: -16px;
      border: 2.5px solid rgba(255,255,255,0.12);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      z-index: 10001; opacity: 0; pointer-events: none;
      transition: opacity 0.3s var(--ease-soft);
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }
    .LoadingSpinner.show { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ErrorToast {
      position: fixed; top: 28px; left: 50%;
      transform: translateX(-50%) translateY(-16px) scale(0.96);
      background:
        linear-gradient(180deg, rgba(220,50,50,0.96) 0%, rgba(180,25,25,0.96) 100%);
      color: #fff;
      padding: 12px 22px; border-radius: 14px;
      font-size: 14px; font-weight: 600;
      letter-spacing: -0.01em;
      z-index: 10002; opacity: 0; pointer-events: none;
      transition: opacity 0.3s var(--ease-soft), transform 0.35s var(--ease-out);
      white-space: nowrap;
      box-shadow:
        0 12px 40px rgba(0,0,0,0.5),
        0 1px 0 rgba(255,255,255,0.15) inset;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .ErrorToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .UnmuteHint {
      position: fixed; top: 28px; left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: rgba(20,20,22,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      padding: 9px 18px 9px 14px;
      border-radius: 999px;
      font-size: 13px; font-weight: 500;
      letter-spacing: -0.005em;
      z-index: 10001; opacity: 0; pointer-events: none;
      transition: opacity 0.35s var(--ease-soft), transform 0.4s var(--ease-out);
      display: flex; align-items: center; gap: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 10px 32px rgba(0,0,0,0.5),
        0 1px 0 rgba(255,255,255,0.08) inset;
    }
    .UnmuteHint::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74,222,128,0.8);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }
    .UnmuteHint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* --- Idle UI --- */
    body.IdleUI .ChannelInfo { opacity: 0 !important; }
    body.IdleUI .ChannelInfo { transform: translateY(-50%) scale(0.95) !important; }

    body.IdleUI:not(.isPaused) .CenterPlayOverlay {
      opacity: 0 !important;
      transform: scale(0.94);
      pointer-events: none !important;
    }
    body.IdleUI:not(.isPaused) .CenterPlayBtn,
    body.IdleUI:not(.isPaused) .CenterCircleBtn,
    body.IdleUI:not(.isPaused) .VolumeWrapper {
      pointer-events: none !important;
    }

    /* --- Mobile --- */
    @media (max-width: 640px) {
      .CenterPlayBtn { width: 74px; height: 74px; }
      .CenterPlayBtn svg { width: 30px; height: 30px; }
      .CenterCircleBtn { width: 48px; height: 48px; }
      .CenterCircleBtn svg { width: 20px; height: 20px; }
      .CenterButtonsRow { gap: 16px; }

      .CenterSpacerLeft { width: 176px; height: 48px; }  /* 48+16+48+16+48 */

      .ChannelInfo {
        right: calc(50% + 56px);
        gap: 12px;
        max-width: 200px;
      }
      .ChannelInfo img { width: 34px; height: 34px; }
      .ChannelInfo span { font-size: 17px; }

      .GridContainer {
        padding: 16px 8px; gap: 14px 12px;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      }
      .GridItem { width: 72px; height: 72px; }
      .VolumeSliderPopup { width: 46px; height: 150px; }
      .VolumeSliderContainer { width: 120px; height: 44px; }
    }
    @media (max-width: 450px) {
      .ChannelInfo { max-width: 140px; gap: 8px; }
      .ChannelInfo img { width: 28px; height: 28px; }
      .ChannelInfo span { font-size: 14px; }
      .GridContainer {
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 12px 10px;
      }
      .GridItem { width: 64px; height: 64px; }
    }
  </style>
</head>

<body class="isPaused">

  <video id="video" playsinline webkit-playsinline muted></video>

  <div class="Vignette" aria-hidden="true"></div>

  <div class="LoadingSpinner" id="loading" aria-hidden="true"></div>
  <div class="ErrorToast" id="errorToast" role="alert"></div>
  <div class="UnmuteHint" id="unmuteHint">Klikněte kamkoli pro zapnutí zvuku</div>

  <div class="CenterPlayOverlay" id="centerPlayOverlay">

    <div class="ChannelInfo" id="channelInfo" aria-live="polite">
      <span id="channelName"></span>
      <img id="channelLogo" src="" alt="" />
    </div>

    <div class="CenterButtonsRow">
      <div class="CenterSpacerLeft" aria-hidden="true"></div>

      <div class="CenterPlayBtn" id="centerPlayBtn" role="button" tabindex="0" aria-label="Přehrát / pozastavit">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
      </div>

      <div class="CenterCircleBtn" id="gridBtn" role="button" tabindex="0" aria-label="Seznam kanálů" title="Seznam kanálů (G)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
      </div>

      <div class="VolumeWrapper" id="volumeWrapper">
        <div class="CenterCircleBtn" id="muteBtn" role="button" tabindex="0" aria-label="Hlasitost" title="Hlasitost (M)">
          <svg id="volumeIcon" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19 5C21 7 22 9.5 22 12C22 14.5 21 17 19 19"></path>
            <path d="M15.5 8C16.8 9.2 17.5 10.5 17.5 12C17.5 13.5 16.8 14.8 15.5 16"></path>
          </svg>
        </div>
        <div class="VolumeSliderPopup">
          <div class="VolumeSliderContainer">
            <input id="volumeSlider" type="range" min="0" max="100" value="100" aria-label="Hlasitost" />
          </div>
        </div>
      </div>

      <div class="CenterCircleBtn" id="fullscreenBtn" role="button" tabindex="0" aria-label="Celá obrazovka" title="Celá obrazovka (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </div>
    </div>
  </div>

  <div class="GridOverlay" id="gridOverlay" role="dialog" aria-label="Seznam kanálů">
    <div class="GridContainer" id="gridContainer"></div>
  </div>

  <script>
    const streams = [
      { name: "ČT1", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/ct1.png", url: "http://88.212.15.47/live/test_ct1_25p/playlist.m3u8" },
      { name: "ČT2", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/ct2.png", url: "http://88.212.15.47/live/test_ct2_25p/playlist.m3u8" },
      { name: "ČT24", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/ct24.png", url: "http://88.212.15.47/live/ct24_avc_25p/playlist.m3u8" },
      { name: "ČT Sport", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/ctsport.png", url: "http://88.212.15.47/live/test_ct_sport_hevc_25p/playlist.m3u8" },
      { name: "TV Nova", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/nova.png", url: "http://88.212.15.47/live/nova_avc_25p/playlist.m3u8" },
      { name: "Nova Cinema", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/novacinema.png", url: "http://88.212.15.47/live/nova_cinema_avc_25p/playlist.m3u8" },
      { name: "Nova Fun", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/novafun.png", url: "http://88.212.15.47/live/nova_fun_avc_25p/playlist.m3u8" },
      { name: "Nova Action", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/novaaction.png", url: "http://88.212.15.47/live/nova_action_avc_25p/playlist.m3u8" },
      { name: "Nova Gold", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/novagold.png", url: "http://88.212.15.47/live/nova_gold_avc_25p/playlist.m3u8" },
      { name: "Nova Lady", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/novalady.png", url: "http://88.212.15.47/live/test_nova_lady_hevc_25p/playlist.m3u8" },
      { name: "Prima", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/prima.png", url: "http://88.212.15.47/live/prima_avc_25p/playlist.m3u8" },
      { name: "Prima COOL", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/primacool.png", url: "http://88.212.15.47/live/prima_cool_cz_hevc/index.m3u8" },
      { name: "Prima KRIMI", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/primakrimi.png", url: "http://88.212.15.47/live/test_prima_krimi_hevc/playlist.m3u8" },
      { name: "Prima LOVE", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/primalove.png", url: "http://88.212.15.47/live/test_prima_love_hevc/playlist.m3u8" },
      { name: "Prima ZOOM", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/primazoom.png", url: "http://88.212.15.47/live/test_prima_zoom_hevc/playlist.m3u8" },
      { name: "Prima Show", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/primashow.png", url: "http://88.212.15.47/live/prima_show_25p/playlist.m3u8" },
      { name: "CNN Prima News", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/cnnprimanews.png", url: "http://88.212.15.47/live/test_cnn_pirma_news/playlist.m3u8" },
      { name: "AMC", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/amc.png", url: "http://88.212.15.47/live/test_amc_25p/playlist.m3u8" },
      { name: "AXN", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/axn.png", url: "http://88.212.15.47/live/test_axn/playlist.m3u8" },
      { name: "Cinemax", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/cinemax.png", url: "http://88.212.15.47/live/test_cinemax_hd_hevc/playlist.m3u8" },
      { name: "Cinemax 2", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/cinemax2.png", url: "http://88.212.15.47/live/test_cinemax2_hd_hevc/playlist.m3u8" },
      { name: "Film+", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/filmplus.png", url: "http://88.212.15.47/live/test_film_plus_25p/playlist.m3u8" },
      { name: "Filmbox", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/filmbox.png", url: "http://88.212.15.47/live/test_filmbox/playlist.m3u8" },
      { name: "HBO", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/hbo.png", url: "http://88.212.15.47/live/test_hbo_hd_hevc/playlist.m3u8" },
      { name: "HBO 2", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/hbo2.png", url: "http://88.212.15.47/live/test_hbo2_hd_hevc/playlist.m3u8" },
      { name: "HBO 3", logo: "https://raw.githubusercontent.com/MarhyCZ/picons/refs/heads/master/640/hbo3.png", url: "http://88.212.15.47/live/test_hbo3_hd_hevc/playlist.m3u8" },
    ];

    streams.forEach(s => { const i = new Image(); i.src = s.logo; });

    const video = document.getElementById("video");
    const gridContainer = document.getElementById("gridContainer");
    const gridOverlay = document.getElementById("gridOverlay");
    const gridBtn = document.getElementById("gridBtn");
    const centerPlayBtn = document.getElementById("centerPlayBtn");
    const muteBtn = document.getElementById("muteBtn");
    const volumeIcon = document.getElementById("volumeIcon");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeWrapper = document.getElementById("volumeWrapper");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const channelLogo = document.getElementById("channelLogo");
    const channelName = document.getElementById("channelName");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("errorToast");
    const unmuteHint = document.getElementById("unmuteHint");

    let activeIndex = 0;
    let hoverIndex = 0;
    let hls = null;
    let idleTimer = null;
    let volumeTimer = null;
    let errorTimer = null;
    let clickTimer = null;
    let isPlaying = false;
    let retryCount = 0;
    let currentLoadId = 0;
    let pendingUnmute = true;
    const VOLUME_KEY = "tv_grid_volume";

    function setLoading(on) { loadingEl.classList.toggle("show", !!on); }
    function showError(msg) {
      setLoading(false);
      errorEl.textContent = msg;
      errorEl.classList.add("show");
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => errorEl.classList.remove("show"), 4000);
    }

    function persistVolume() {
      try { localStorage.setItem(VOLUME_KEY, String(video.muted ? 0 : video.volume)); } catch (_) {}
    }
    function restoreVolume() {
      let saved = NaN;
      try { saved = parseFloat(localStorage.getItem(VOLUME_KEY)); } catch (_) {}
      if (!isNaN(saved) && saved >= 0 && saved <= 1) {
        video.volume = saved;
        volumeSlider.value = Math.round(saved * 100);
        if (saved === 0) { video.muted = true; pendingUnmute = false; }
      } else {
        video.volume = 1; volumeSlider.value = 100;
      }
    }

    streams.forEach((stream, index) => {
      const item = document.createElement("div");
      item.className = "GridItem" + (index === 0 ? " active" : "");
      item.dataset.index = index;
      item.setAttribute("role", "button");
      item.setAttribute("tabindex", "-1");
      item.setAttribute("aria-label", stream.name);
      item.title = stream.name;
      item.innerHTML = `<img src="${stream.logo}" alt="${stream.name}" draggable="false" />`;

      item.addEventListener("mouseenter", () => setHover(index, false));
      item.addEventListener("mouseleave", () => item.classList.remove("hovered"));
      item.addEventListener("click", (e) => {
        e.stopPropagation();
        selectChannel(index);
        closeGrid();
      });
      gridContainer.appendChild(item);
    });
    const gridItems = Array.from(gridContainer.children);

    function destroyHls() {
      if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
    }

    function loadStream(url, channelNameForError) {
      const loadId = ++currentLoadId;
      retryCount = 0;
      setLoading(true);
      destroyHls();

      if (!window.Hls || !Hls.isSupported()) {
        video.removeAttribute("src");
        video.load();
      }

      const canNative = video.canPlayType("application/vnd.apple.mpegurl");

      if (window.Hls && Hls.isSupported()) {
        const instance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90,
        });
        hls = instance;
        instance.loadSource(url);
        instance.attachMedia(video);

        instance.on(Hls.Events.MANIFEST_PARSED, () => {
          if (loadId !== currentLoadId) return;
          video.play().catch(() => {});
        });

        instance.on(Hls.Events.ERROR, (event, data) => {
          if (loadId !== currentLoadId) return;
          if (!data || !data.fatal) return;
          if (retryCount < 3) {
            retryCount++;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              try { instance.startLoad(); return; } catch (_) {}
            }
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              try { instance.recoverMediaError(); return; } catch (_) {}
            }
          }
          destroyHls();
          setLoading(false);
          showError(`Kanál „${channelNameForError}“ se nepodařilo načíst`);
        });

      } else if (canNative) {
        video.src = url;
        video.play().catch(() => {});
      } else {
        setLoading(false);
        showError("HLS přehrávání není v tomto prohlížeči podporováno");
      }
    }

    function selectChannel(index) {
      if (typeof index !== "number" || isNaN(index)) return;
      index = ((index % streams.length) + streams.length) % streams.length;
      activeIndex = index;
      hoverIndex = index;
      channelLogo.src = streams[index].logo;
      channelName.textContent = streams[index].name;
      gridItems.forEach((el, i) => {
        el.classList.toggle("active", i === index);
        el.classList.toggle("hovered", i === index);
      });
      loadStream(streams[index].url, streams[index].name);
      resetIdleTimer();
    }

    function updatePlayIcon() {
      const svg = centerPlayBtn.querySelector("svg");
      svg.innerHTML = isPlaying
        ? '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>'
        : '<polygon points="6 3.5 19.5 12 6 20.5 6 3.5"></polygon>';
    }

    function togglePlay() {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
      resetIdleTimer();
    }

    video.addEventListener("play", () => {
      isPlaying = true;
      document.body.classList.remove("isPaused");
      updatePlayIcon();
    });
    video.addEventListener("pause", () => {
      isPlaying = false;
      document.body.classList.add("isPaused");
      updatePlayIcon();
    });
    video.addEventListener("playing", () => setLoading(false));
    video.addEventListener("canplay", () => setLoading(false));
    video.addEventListener("waiting", () => setLoading(true));
    video.addEventListener("error", () => {
      if (hls) return;
      setLoading(false);
      showError("Chyba přehrávání streamu");
    });

    function setHover(index, scroll) {
      if (index < 0 || index >= streams.length) return;
      hoverIndex = index;
      gridItems.forEach((el, i) => el.classList.toggle("hovered", i === index));
      if (scroll && gridItems[index]) {
        gridItems[index].scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    function getGridColumns() {
      if (!gridItems.length) return 1;
      const firstTop = gridItems[0].offsetTop;
      let cols = 0;
      for (const el of gridItems) {
        if (el.offsetTop === firstTop) cols++; else break;
      }
      return Math.max(1, cols);
    }

    function moveGridFocus(key) {
      const cols = getGridColumns();
      let next = hoverIndex;
      if (key === "ArrowRight") next = hoverIndex + 1;
      else if (key === "ArrowLeft") next = hoverIndex - 1;
      else if (key === "ArrowDown") next = hoverIndex + cols;
      else if (key === "ArrowUp") next = hoverIndex - cols;

      if (key === "ArrowRight" && next >= streams.length) next = 0;
      if (key === "ArrowLeft" && next < 0) next = streams.length - 1;
      if ((key === "ArrowUp" || key === "ArrowDown") && (next < 0 || next >= streams.length)) {
        next = hoverIndex;
      }
      setHover(next, true);
    }

    function openGrid() {
      setHover(activeIndex, true);
      gridOverlay.classList.add("active");
      resetIdleTimer();
    }
    function closeGrid() {
      gridOverlay.classList.remove("active");
      resetIdleTimer();
    }
    function toggleGrid() {
      gridOverlay.classList.contains("active") ? closeGrid() : openGrid();
    }

    function setActiveUI() { document.body.classList.remove("IdleUI"); }
    function setIdleUI() {
      document.body.classList.add("IdleUI");
      volumeWrapper.classList.remove("open");
    }
    function resetIdleTimer() {
      setActiveUI();
      clearTimeout(idleTimer);
      idleTimer = setTimeout(setIdleUI, 3000);
    }

    function tryUnmuteOnGesture(e) {
      if (!pendingUnmute) return;
      if (e && e.target && (e.target.closest("#muteBtn") || e.target.closest(".VolumeSliderContainer"))) return;
      pendingUnmute = false;
      video.muted = false;
      updateVolumeIcon();
      volumeSlider.value = Math.round(video.volume * 100);
      persistVolume();
      unmuteHint.classList.remove("show");
    }

    restoreVolume();
    updateVolumeIcon();

    function updateVolumeIcon() {
      if (video.muted || video.volume === 0) {
        volumeIcon.innerHTML =
          '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
          '<line x1="23" y1="9" x2="17" y2="15"></line>' +
          '<line x1="17" y1="9" x2="23" y2="15"></line>';
      } else {
        volumeIcon.innerHTML =
          '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
          '<path d="M19 5C21 7 22 9.5 22 12C22 14.5 21 17 19 19"></path>' +
          '<path d="M15.5 8C16.8 9.2 17.5 10.5 17.5 12C17.5 13.5 16.8 14.8 15.5 16"></path>';
      }
    }

    function showVolumePopup() {
      volumeWrapper.classList.add("open");
      clearTimeout(volumeTimer);
      volumeTimer = setTimeout(() => {
        if (!volumeWrapper.matches(":hover")) volumeWrapper.classList.remove("open");
      }, 2000);
    }

    function changeVolume(delta) {
      pendingUnmute = false;
      video.muted = false;
      const next = Math.min(1, Math.max(0, (video.volume || 0) + delta));
      video.volume = next;
      if (next === 0) video.muted = true;
      volumeSlider.value = Math.round(next * 100);
      updateVolumeIcon();
      persistVolume();
      showVolumePopup();
    }

    function toggleMute() {
      pendingUnmute = false;
      if (video.muted || video.volume === 0) {
        video.muted = false;
        if (video.volume === 0) video.volume = 1;
        volumeSlider.value = Math.round(video.volume * 100);
      } else {
        video.muted = true;
        volumeSlider.value = 0;
      }
      updateVolumeIcon();
      persistVolume();
      showVolumePopup();
      resetIdleTimer();
    }

    volumeSlider.addEventListener("input", () => {
      pendingUnmute = false;
      const v = Number(volumeSlider.value);
      video.volume = v / 100;
      video.muted = v === 0;
      updateVolumeIcon();
      persistVolume();
      showVolumePopup();
      resetIdleTimer();
    });

    muteBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleMute(); });
    muteBtn.addEventListener("mouseenter", () => {
      volumeWrapper.classList.add("open");
      clearTimeout(volumeTimer);
      resetIdleTimer();
    });
    volumeWrapper.addEventListener("mouseenter", () => clearTimeout(volumeTimer));
    volumeWrapper.addEventListener("mouseleave", () => {
      clearTimeout(volumeTimer);
      volumeTimer = setTimeout(() => {
        if (!volumeWrapper.matches(":hover")) volumeWrapper.classList.remove("open");
      }, 1500);
    });
    video.addEventListener("volumechange", () => {
      volumeSlider.value = Math.round((video.volume || 0) * 100);
      updateVolumeIcon();
    });

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }
    function toggleFullscreen() {
      const el = document.documentElement;
      if (!getFullscreenElement()) {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); }
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); }
      }
    }
    fullscreenBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });

    centerPlayBtn.addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });
    gridBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleGrid(); });
    gridOverlay.addEventListener("click", (e) => { if (e.target === gridOverlay) closeGrid(); });

    document.addEventListener("click", (e) => {
      if (e.target.closest(".CenterButtonsRow")) return;
      if (e.target.closest(".GridOverlay")) return;
      if (clickTimer) return;
      clickTimer = setTimeout(() => {
        clickTimer = null;
        togglePlay();
      }, 200);
    });

    document.addEventListener("dblclick", (e) => {
      if (e.target.closest(".CenterButtonsRow")) return;
      if (e.target.closest(".GridOverlay")) return;
      clearTimeout(clickTimer);
      clickTimer = null;
      toggleFullscreen();
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    window.addEventListener("mousemove", resetIdleTimer, { passive: true });
    window.addEventListener("mousedown", resetIdleTimer, { passive: true });
    window.addEventListener("touchstart", resetIdleTimer, { passive: true });

    document.addEventListener("click", tryUnmuteOnGesture, { capture: true });
    document.addEventListener("touchstart", tryUnmuteOnGesture, { passive: true, capture: true });
    document.addEventListener("keydown", tryUnmuteOnGesture, { capture: true });

    window.addEventListener("keydown", (e) => {
      resetIdleTimer();
      const isGridOpen = gridOverlay.classList.contains("active");

      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (isGridOpen) { selectChannel(hoverIndex); closeGrid(); }
        else togglePlay();
        return;
      }

      if (e.key === "Escape") { if (isGridOpen) closeGrid(); return; }
      if (e.key === "f" || e.key === "F") { toggleFullscreen(); return; }
      if (e.key === "m" || e.key === "M") { toggleMute(); return; }
      if (e.key === "g" || e.key === "G") { toggleGrid(); return; }

      if (["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown"].includes(e.key)) {
        e.preventDefault();
        if (isGridOpen) { moveGridFocus(e.key); return; }
        if (e.key === "ArrowRight") selectChannel(activeIndex + 1);
        else if (e.key === "ArrowLeft") selectChannel(activeIndex - 1);
        else if (e.key === "ArrowUp") changeVolume(0.05);
        else changeVolume(-0.05);
      }
    });

    window.addEventListener("wheel", (e) => {
      resetIdleTimer();
      if (gridOverlay.classList.contains("active")) return;
      if (!e.deltaY) return;
      changeVolume(e.deltaY < 0 ? 0.03 : -0.03);
    }, { passive: true });

    document.body.classList.add("isPaused");

    setTimeout(() => {
      if (pendingUnmute) unmuteHint.classList.add("show");
    }, 1500);

    updatePlayIcon();
    selectChannel(0);
    resetIdleTimer();
  </script>
</body>

</html>
